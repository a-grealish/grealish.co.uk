name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Hugo
        # peaceiris/actions-hugo v3.2.1
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Deploy
        # peaceiris/actions-gh-pages v4.1.0
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: a-grealish/a-grealish.github.io
          publish_branch: main
          publish_dir: ./public
          cname: grealish.co.uk
          force_orphan: true
