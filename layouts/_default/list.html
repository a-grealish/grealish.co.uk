{{ define "main" }}
  {{ partial "header.html" . }}

  <div class="container">
    <h1 class="h4 my-5">{{ .Title }}</h1>
    <div class="panel">
      <div class="panel-body">
        {{ range .Pages }}
          <div class="row mb-2">
            <div class="col-4">
              <p class="h5 text-end my-1">
                {{ if not .Date.IsZero }}{{ partial "post-date.html" . }}{{ end }}
              </p>
            </div>
            <div class="col-8">
              <p class="h5 text-start my-1">
                <b><a href="{{ .RelPermalink }}">{{ .Title | markdownify }}</a></b>
              </p>
            </div>
          </div>
        {{ end }}
      </div>
    </div>
  </div>
{{ end }}
