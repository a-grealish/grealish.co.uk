{{ define "main" }}
  {{ partial "header.html" . }}

  <div class="container">
    <h1 class="page-title mt-3 mb-5">{{ .Title }}</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      {{ range .Pages }}
        {{ $post := . }}
        <div class="col">
          <div class="card h-100">
            {{ with $post.Params.images }}
              {{ with index . 0 }}
                <a href="{{ $post.RelPermalink }}">
                  <img src="{{ . | relURL }}" class="card-img-top" alt="{{ $post.Title }}">
                </a>
              {{ end }}
            {{ end }}
            <div class="card-body d-flex flex-column">
              <a href="{{ $post.RelPermalink }}" class="text-decoration-none">
                <h2 class="card-title">{{ $post.Title | markdownify }}</h2>
              </a>
              {{ partial "post-meta.html" $post }}
              <p class="card-text flex-grow-1">{{ $post.Description }}</p>
            </div>
          </div>
        </div>
      {{ end }}
    </div>
  </div>
{{ end }}
