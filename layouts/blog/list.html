{{ define "main" }}
  {{ partial "header.html" . }}

  <div class="container">
    <div class="row">
      <h1>{{ .Title }}</h1>
    </div>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      {{ range .Pages }}
        <div class="col">
          <div class="card h-100">
            {{ with .Params.images }}
              {{ with index . 0 }}
                <a href="{{ $.RelPermalink }}">
                  <img src="{{ . | relURL }}" class="card-img-top" alt="{{ $.Title }}">
                </a>
              {{ end }}
            {{ end }}
            <div class="card-body d-flex flex-column">
              <a href="{{ .RelPermalink }}" class="text-decoration-none">
                <h5 class="card-title">{{ .Title | markdownify }}</h5>
              </a>
              {{ partial "post-meta.html" . }}
              <p class="card-text flex-grow-1">{{ .Description }}</p>
            </div>
          </div>
        </div>
      {{ end }}
    </div>
  </div>
{{ end }}
