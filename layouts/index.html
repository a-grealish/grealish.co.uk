{{ define "main" }}
  {{ partial "header.html" . }}

  <section id="about">
    <div class="container">
      <div class="avatar mb-5">
        <img class="rounded-circle" src="{{ site.Params.avatar | relURL }}" alt="Portrait of {{ site.Params.author }}">
      </div>
      {{ .Content }}
      {{ partial "social.html" . }}
    </div>
  </section>
{{ end }}
