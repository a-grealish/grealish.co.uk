<div class="post-meta">
  <div class="post-tags mb-2">
    <span class="badge badge-tag">{{ index .Params.types 0 }}</span>
    {{ range .Params.tags }}
      <a href="/tags/{{ . | urlize }}/" class="badge badge-tag">{{ . }}</a>
    {{ end }}
  </div>
  <p>
    {{ .Params.venue }} &middot;
    {{ if not .Date.IsZero }}
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
    {{ end }}
  </p>
</div>
